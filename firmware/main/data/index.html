<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3">
  <title>FastRobox Smart Classroom Local Status</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #7c3aed;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --green: #22c55e;
      --red: #ef4444;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
      color: #fff;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #238636;
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .card-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .card-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    .ok { color: var(--green); }
    .warn { color: var(--red); }
    .btn-row {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
    .btn {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #21262d; color: var(--text); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>FastRobox Smart Classroom</h1>
        <div style="font-size:0.85rem;color:var(--text-muted);margin-top:0.25rem">Local ESP32-S3-CAM Node</div>
      </div>
      <span class="badge" id="live-badge">ONLINE</span>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-title">Temperature</div>
        <div class="card-val" id="temp">-- °C</div>
      </div>
      <div class="card">
        <div class="card-title">Humidity</div>
        <div class="card-val" id="hum">-- %</div>
      </div>
      <div class="card">
        <div class="card-title">Flame Status</div>
        <div class="card-val" id="flame">--</div>
      </div>
      <div class="card">
        <div class="card-title">Simulated Door</div>
        <div class="card-val" id="door">--</div>
      </div>
      <div class="card">
        <div class="card-title">WiFi RSSI</div>
        <div class="card-val" id="rssi">-- dBm</div>
      </div>
      <div class="card">
        <div class="card-title">System Uptime</div>
        <div class="card-val" id="uptime">-- s</div>
      </div>
    </div>

    <div class="btn-row">
      <form action="/door" method="POST" style="flex:1">
        <button type="submit" class="btn btn-primary" style="width:100%">Toggle Door (Simulated)</button>
      </form>
      <a href="/stream" target="_blank" class="btn btn-secondary">Open Camera Feed</a>
    </div>
  </div>

  <script>
    fetch('/status.json')
      .then(res => res.json())
      .then(d => {
        document.getElementById('temp').innerText = d.temperature.toFixed(1) + ' °C';
        document.getElementById('hum').innerText = d.humidity.toFixed(1) + ' %';
        const flameEl = document.getElementById('flame');
        flameEl.innerText = d.flame ? '🔥 DETECTED' : '✅ SAFE';
        flameEl.className = 'card-val ' + (d.flame ? 'warn' : 'ok');

        const doorEl = document.getElementById('door');
        doorEl.innerText = d.door_locked ? '🔒 LOCKED' : '🔓 UNLOCKED';
        doorEl.className = 'card-val ' + (d.door_locked ? 'warn' : 'ok');

        document.getElementById('rssi').innerText = d.wifi_rssi + ' dBm';
        document.getElementById('uptime').innerText = d.uptime_sec + ' s';
      })
      .catch(() => {});
  </script>
</body>
</html>
